name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时创建 Release 需要

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build LiteOC.app
        working-directory: gui
        env:
          LITEOC_VERSION: ${{ github.ref_name }}   # tag 形如 v1.3; build.sh 会去掉前导 v
        run: ./build.sh

      - name: Assemble self-contained zip
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            STAGE="LiteOC-${GITHUB_REF_NAME#v}"
          else
            STAGE="LiteOC-${GITHUB_SHA::7}"
          fi
          rm -rf dist && mkdir -p "dist/$STAGE"
          cp -R gui/build/LiteOC.app "dist/$STAGE/"
          cp gui/vpnctl gui/setup-root.sh gui/INSTALL.txt "dist/$STAGE/"
          ( cd dist && ditto -c -k --keepParent "$STAGE" "$STAGE.zip" )
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          echo "→ 产物: dist/$STAGE.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGE }}
          path: dist/*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
