name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时创建 Release 需要

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate release source and main history
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          previous_tag="$(git tag --sort=-version:refname | awk -v current="$GITHUB_REF_NAME" '$0 != current && $0 ~ /^v[0-9]+\.[0-9]+(\.[0-9]+)?$/ { print; exit }')"
          test -n "$previous_tag"
          sh scripts/release-gate.sh notes "$GITHUB_REF_NAME" "$previous_tag" RELEASE_NOTES.md
          sh scripts/release-gate.sh ancestry "$GITHUB_SHA" origin/main

      - name: Test menu and vpnctl contracts
        run: |
          sh gui/test/connect_cli_test.sh
          sh gui/test/app_config_test.sh
          sh gui/test/config_fixture_test.sh
          sh gui/test/menu_presentation_test.sh
          sh gui/test/menu_bar_icon_test.sh
          sh gui/test/vpnctl_client_test.sh
          sh gui/test/tunnel_reducer_test.sh
          sh gui/test/tunnel_events_test.sh
          sh gui/test/main_thread_polling_test.sh
          sh gui/test/app_architecture_test.sh
          sh gui/test/app_bundle_resources_test.sh
          sh gui/test/vpnctl_wiring_test.sh
          sh gui/test/vpnctl_locale_test.sh
          sh gui/test/vpnctl_status_test.sh
          sh gui/test/vpnctl_route_test.sh
          sh gui/test/release_gate_test.sh
          sh gui/test/release_skill_test.sh

      - name: Install openconnect + dylibbundler
        run: brew install openconnect dylibbundler

      - name: Build self-contained openconnect (oc-bundle)
        working-directory: gui
        run: |
          mkdir -p build/oc-bundle
          cp "$(brew --prefix openconnect)/bin/openconnect" build/oc-bundle/openconnect
          dylibbundler -cd -b -x build/oc-bundle/openconnect -d build/oc-bundle/libs/ -p @executable_path/libs/
          # 自包含守卫(接缝 2):必须无 /opt/homebrew 引用 + 能跑
          test "$(otool -L build/oc-bundle/openconnect | grep -c /opt/homebrew)" -eq 0
          build/oc-bundle/openconnect --version

      - name: Build LiteOC.app + .pkg
        working-directory: gui
        env:
          LITEOC_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: |
          sh ./build.sh
          sh ./build-pkg.sh

      - name: Gate App and package identity
        env:
          LITEOC_IDENTITY: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: |
          version="${LITEOC_IDENTITY#v}"
          sh scripts/release-gate.sh artifacts "$LITEOC_IDENTITY" gui/build/LiteOC.app "gui/build/LiteOC-$version.pkg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteOC-pkg
          path: gui/build/LiteOC-*.pkg
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LiteOC ${{ github.ref_name }}
          files: gui/build/LiteOC-*.pkg
          body_path: RELEASE_NOTES.md
